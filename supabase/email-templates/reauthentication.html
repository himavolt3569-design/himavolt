<!--
  HimaVolt-branded "Reauthentication" email template.

  Where to paste: Supabase Dashboard -> Authentication -> Email Templates
  -> "Reauthentication" tab -> replace the body with this file's contents.
  Subject heading field: "Your HimaVolt confirmation code"

  When this fires: Supabase's reauthentication flow for sensitive actions
  (e.g. before a password change, if "Secure password change" is enabled
  in your project's Auth settings). Unlike the others, this one shows a
  6-digit CODE the user types back into the app, not a clickable link —
  {{ .Token }} is the code, there is no ConfirmationURL here.
-->
<!doctype html>
<html>
  <body style="margin:0; padding:0; background-color:#fcfaf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fcfaf8; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 440px; background-color:#ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #eee0d2;">
            <tr>
              <td style="padding: 32px 32px 8px 32px; text-align:center;">
                <div style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color:#2c1a0e;">
                  Hima<span style="color:#eaa94d;">Volt</span>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 0 32px; text-align:center;">
                <h1 style="margin:0 0 8px 0; font-size: 20px; color:#2c1a0e;">Confirm it&rsquo;s you</h1>
                <p style="margin:0; font-size: 14px; line-height:1.6; color:#5c4131;">
                  Enter this code in HimaVolt to confirm this sensitive action. It expires shortly.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px; text-align:center;">
                <div style="display:inline-block; background-color:#fff3e0; border: 1px dashed #eaa94d; border-radius: 12px; padding: 16px 32px; font-size: 32px; font-weight: 800; letter-spacing: 8px; color:#2c1a0e;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 28px 32px; text-align:center;">
                <p style="margin:0; font-size: 12px; color:#a08b76;">
                  Didn&rsquo;t request this? You can safely ignore this email &mdash; nothing will change.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 20px 0 0 0; font-size: 11px; color:#a08b76; text-align:center;">
            HimaVolt &middot; Nepal&rsquo;s smart ordering &amp; restaurant management platform
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
